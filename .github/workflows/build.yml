name: Build

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  RELEASE_VERSION: "1.4.0"

jobs:
  widget:
    name: Shared widget syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check usage-widget.js

  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        run: scripts/build-macos.sh "${RELEASE_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-macOS-arm64-v${{ env.RELEASE_VERSION }}
          path: outputs/Codex-Meter-macOS-arm64-v${{ env.RELEASE_VERSION }}.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore tests
        run: dotnet restore windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj
      - name: Run tests
        run: dotnet test windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj --configuration Release --no-restore
      - name: Build portable package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version $env:RELEASE_VERSION
      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $smokeDirectory = Join-Path $env:RUNNER_TEMP "codex-meter-smoke"
          Expand-Archive "outputs/Codex-Meter-Windows-x64-v$($env:RELEASE_VERSION).zip" $smokeDirectory
          $process = Start-Process `
            -FilePath (Join-Path $smokeDirectory "Codex Meter.exe") `
            -ArgumentList "--self-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged app smoke test failed with exit code $($process.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-Windows-x64-v${{ env.RELEASE_VERSION }}
          path: outputs/Codex-Meter-Windows-x64-v${{ env.RELEASE_VERSION }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - windows
      - widget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release version
        run: test "${GITHUB_REF_NAME}" = "v${RELEASE_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Meter-macOS-arm64-v${{ env.RELEASE_VERSION }}
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Meter-Windows-x64-v${{ env.RELEASE_VERSION }}
          path: release-artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release-artifacts/Codex-Meter-macOS-arm64-v${RELEASE_VERSION}.dmg" \
            "release-artifacts/Codex-Meter-Windows-x64-v${RELEASE_VERSION}.zip" \
            --title "Codex Meter ${GITHUB_REF_NAME}" \
            --notes "性能与稳定性更新：降低折叠和后台状态下的资源占用，复用 Codex App Server 连接并增强失败恢复，过滤内部 guardian 会话，同时改进 Windows WebView 与系统休眠/锁屏状态处理。"
