name: Build

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  RELEASE_VERSION: "1.4.1"

jobs:
  widget:
    name: Shared widget syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check usage-widget.js

  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        run: scripts/build-macos.sh "${RELEASE_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-macOS-arm64-v${{ env.RELEASE_VERSION }}
          path: outputs/Codex-Meter-macOS-arm64-v${{ env.RELEASE_VERSION }}.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore tests
        run: dotnet restore windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj
      - name: Run tests
        run: dotnet test windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj --configuration Release --no-restore
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version $env:RELEASE_VERSION
      - name: Smoke test installer payload
        shell: pwsh
        run: |
          $installer = "outputs/Codex-Meter-Windows-x64-v$($env:RELEASE_VERSION).exe"
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "--self-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged app smoke test failed with exit code $($process.ExitCode)"
          }
          $installDirectory = Join-Path $env:RUNNER_TEMP "Codex Meter"
          $env:CODEX_METER_INSTALL_DIRECTORY = $installDirectory
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "--quiet-install" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer test installation failed with exit code $($process.ExitCode)"
          }
          $installedApp = Join-Path $installDirectory "Codex Meter.exe"
          $uninstaller = Join-Path $installDirectory "Codex Meter Uninstaller.exe"
          $shortcut = Join-Path `
            ([Environment]::GetFolderPath([Environment+SpecialFolder]::Programs)) `
            "Codex Meter\Codex Meter.lnk"
          $desktopDirectory = [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
          if ([string]::IsNullOrWhiteSpace($desktopDirectory)) {
            $desktopDirectory = [Environment]::ExpandEnvironmentVariables(
              (Get-ItemPropertyValue `
                -LiteralPath "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders" `
                -Name "Desktop")
            )
          }
          $desktopShortcut = Join-Path $desktopDirectory "Codex Meter.lnk"
          $registeredLocation = Get-ItemPropertyValue `
            -LiteralPath "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CodexMeter" `
            -Name "InstallLocation"
          if (-not (Test-Path $installedApp) -or -not (Test-Path $uninstaller)) {
            throw "Installer did not create the expected application files"
          }
          if (-not (Test-Path $shortcut) -or -not (Test-Path $desktopShortcut) -or $registeredLocation -ne $installDirectory) {
            throw "Installer did not register the selected installation location"
          }
          $settingsDirectory = Join-Path $env:LOCALAPPDATA "Codex Meter"
          New-Item -ItemType Directory -Path $settingsDirectory -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $settingsDirectory "installer-test.marker") -Value "test"
          $env:CODEX_METER_PRESERVE_SETTINGS = "0"
          $process = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList "--quiet-uninstall" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer test uninstall failed with exit code $($process.ExitCode)"
          }
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            if (-not (Test-Path $installDirectory) -and -not (Test-Path $settingsDirectory)) {
              break
            }
            Start-Sleep -Milliseconds 250
          }
          if ((Test-Path $installDirectory) -or (Test-Path $settingsDirectory) -or
              (Test-Path $shortcut) -or (Test-Path $desktopShortcut)) {
            throw "Installer test uninstall left application files, settings, or shortcuts behind"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-Windows-x64-v${{ env.RELEASE_VERSION }}
          path: outputs/Codex-Meter-Windows-x64-v${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - windows
      - widget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release version
        run: test "${GITHUB_REF_NAME}" = "v${RELEASE_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Meter-macOS-arm64-v${{ env.RELEASE_VERSION }}
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Meter-Windows-x64-v${{ env.RELEASE_VERSION }}
          path: release-artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release-artifacts/Codex-Meter-macOS-arm64-v${RELEASE_VERSION}.dmg" \
            "release-artifacts/Codex-Meter-Windows-x64-v${RELEASE_VERSION}.exe" \
            --title "Codex Meter ${GITHUB_REF_NAME}" \
            --notes "新增可选的开机自启动设置与 Windows 图形化安装/卸载程序；改进首次同步重试、面板固定体验和跨平台构建流程，并补充中英文文档。"
