name: Build

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  MACOS_RELEASE_VERSION: "1.4.4"
  WINDOWS_RELEASE_VERSION: "1.4.2"

jobs:
  widget:
    name: Shared widget syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check usage-widget.js
      - name: Run shared widget state tests
        run: node scripts/test-widget-state.js

  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        run: scripts/build-macos.sh "${MACOS_RELEASE_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-macOS-arm64-v${{ env.MACOS_RELEASE_VERSION }}
          path: outputs/Codex-Meter-macOS-arm64-v${{ env.MACOS_RELEASE_VERSION }}.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore tests
        run: dotnet restore windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj
      - name: Run tests
        run: >-
          dotnet test windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj
          --configuration Release
          --no-restore
          -p:WindowsAppSdkBootstrapInitialize=false
          --blame-hang
          --blame-hang-timeout 2m
          --logger "console;verbosity=detailed"
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version $env:WINDOWS_RELEASE_VERSION
      - name: Smoke test installer payload
        shell: pwsh
        run: |
          $installer = "outputs/Codex-Meter-Windows-x64-v$($env:WINDOWS_RELEASE_VERSION).exe"
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "--self-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged app smoke test failed with exit code $($process.ExitCode)"
          }
          $installDirectory = Join-Path $env:RUNNER_TEMP "Codex Meter"
          $env:CODEX_METER_INSTALL_DIRECTORY = $installDirectory
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "--quiet-install" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            $errorLog = Join-Path $env:TEMP "CodexMeterSetup-error.log"
            if (Test-Path $errorLog) {
              Write-Host "Installer diagnostic log:"
              Get-Content -LiteralPath $errorLog
            }
            throw "Installer test installation failed with exit code $($process.ExitCode)"
          }
          $installedApp = Join-Path $installDirectory "Codex Meter.exe"
          $uninstaller = Join-Path $installDirectory "Codex Meter Uninstaller.exe"
          $shortcut = Join-Path `
            ([Environment]::GetFolderPath([Environment+SpecialFolder]::Programs)) `
            "Codex Meter\Codex Meter.lnk"
          $desktopDirectory = [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
          if ([string]::IsNullOrWhiteSpace($desktopDirectory)) {
            $desktopDirectory = [Environment]::ExpandEnvironmentVariables(
              (Get-ItemPropertyValue `
                -LiteralPath "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders" `
                -Name "Desktop")
            )
          }
          $desktopShortcut = Join-Path $desktopDirectory "Codex Meter.lnk"
          $registeredLocation = Get-ItemPropertyValue `
            -LiteralPath "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CodexMeter" `
            -Name "InstallLocation"
          if (-not (Test-Path $installedApp) -or -not (Test-Path $uninstaller)) {
            throw "Installer did not create the expected application files"
          }
          if (-not (Test-Path $shortcut) -or -not (Test-Path $desktopShortcut) -or $registeredLocation -ne $installDirectory) {
            throw "Installer did not register the selected installation location"
          }
          $process = Start-Process `
            -FilePath $installedApp `
            -ArgumentList "--notification-self-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -eq 2) {
            Write-Host "Notification registration is unsupported on the Windows Server runner; skipping that capability check."
          } elseif ($process.ExitCode -ne 0) {
            throw "Windows notification registration smoke test failed with exit code $($process.ExitCode)"
          }
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "--quiet-install" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $installedApp)) {
            throw "Installer upgrade test failed with exit code $($process.ExitCode)"
          }
          $settingsDirectory = Join-Path $env:LOCALAPPDATA "Codex Meter"
          New-Item -ItemType Directory -Path $settingsDirectory -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $settingsDirectory "installer-test.marker") -Value "test"
          $env:CODEX_METER_PRESERVE_SETTINGS = "0"
          $process = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList "--quiet-uninstall" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer test uninstall failed with exit code $($process.ExitCode)"
          }
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            if (-not (Test-Path $installDirectory) -and -not (Test-Path $settingsDirectory)) {
              break
            }
            Start-Sleep -Milliseconds 250
          }
          if ((Test-Path $installDirectory) -or (Test-Path $settingsDirectory) -or
              (Test-Path $shortcut) -or (Test-Path $desktopShortcut)) {
            throw "Installer test uninstall left application files, settings, or shortcuts behind"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-Windows-x64-v${{ env.WINDOWS_RELEASE_VERSION }}
          path: outputs/Codex-Meter-Windows-x64-v${{ env.WINDOWS_RELEASE_VERSION }}.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos
      - widget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release version
        run: test "${GITHUB_REF_NAME}" = "v${MACOS_RELEASE_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Meter-macOS-arm64-v${{ env.MACOS_RELEASE_VERSION }}
          path: release-artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release-artifacts/Codex-Meter-macOS-arm64-v${MACOS_RELEASE_VERSION}.dmg" \
            --title "Codex Meter ${GITHUB_REF_NAME}" \
            --notes "修复通过 SSH 使用 Codex 时，主面板上下文健康度仍被上一个本机任务占用、无法显示当前远端对话的问题。上下文详情已有更新的远端测量时，主卡片现在会自动跟随；切回并继续本机任务后也会正确恢复。本版本仅发布 macOS 安装包，Windows 的 SSH 对话监控仍在开发中。"
