name: Build

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: scripts/build-native.sh
      - name: Package app
        run: |
          mkdir -p outputs
          ditto -c -k --keepParent "build/Codex Meter.app" "outputs/Codex-Meter-macOS-arm64-v1.1.0.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-macOS-arm64-v1.1.0
          path: outputs/Codex-Meter-macOS-arm64-v1.1.0.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore tests
        run: dotnet restore windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj
      - name: Run tests
        run: dotnet test windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj --configuration Release --no-restore
      - name: Build portable package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version 1.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-Windows-x64-v1.1.0
          path: outputs/Codex-Meter-Windows-x64-v1.1.0.zip
          if-no-files-found: error
